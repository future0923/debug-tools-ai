interface:
  display_name: "DebugTools Spring Config"
  short_description: "Read Spring Environment config from an attached JVM"
  icon_small: "./assets/pluginIcon.png"
  icon_large: "./assets/pluginIcon.png"
  brand_color: "#2563EB"
  default_prompt: "Use $debug-tools-spring-config to read these Spring config keys from the attached app."

dependencies:
  tools:
    - type: "mcp"
      value: "debug-tools"
      description: "DebugTools IntelliJ MCP tools for discovering or attaching a JVM before reading Spring runtime config over DebugTools HTTP."

policy:
  allow_implicit_invocation: true
